name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Public HTTP(S) URL to assess with the bounded v0.4 scan"
        required: true
        default: "https://example.com/"
        type: string

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: pytest -q

  scan-report:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Validate target scope
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          python - <<'PY'
          import ipaddress
          import os
          import socket
          import sys

          from masterkey_agent.core.target import TargetPolicy, normalize_target, validate_target

          raw_url = os.environ["TARGET_URL"].strip()
          policy = TargetPolicy(
              timeout_seconds=10.0,
              max_response_bytes=256 * 1024,
              max_redirects=0,
              allow_http=True,
              allow_https=True,
          )

          try:
              target = normalize_target(raw_url)
              validate_target(target, policy)
          except ValueError as exc:
              raise SystemExit(f"Target rejected: {exc}") from exc

          host = target.hostname
          try:
              literal = ipaddress.ip_address(host)
          except ValueError:
              literal = None

          addresses = {literal} if literal is not None else set()
          if literal is None:
              try:
                  port = target.port or (443 if target.scheme == "https" else 80)
                  infos = socket.getaddrinfo(host, port, type=socket.SOCK_STREAM)
              except OSError as exc:
                  raise SystemExit(f"Target rejected: DNS resolution failed: {exc}") from exc
              addresses = {
                  ipaddress.ip_address(info[4][0])
                  for info in infos
                  if info[4] and info[4][0]
              }

          if not addresses:
              raise SystemExit("Target rejected: hostname did not resolve to an address")

          non_global = sorted(str(address) for address in addresses if not address.is_global)
          if non_global:
              raise SystemExit(
                  "Target rejected: all resolved addresses must be globally routable; "
                  f"blocked addresses: {', '.join(non_global)}"
              )

          print(f"Target accepted: {target.url}")
          print("Resolved public addresses:")
          for address in sorted(str(address) for address in addresses):
              print(f"  {address}")
          print("Redirect following: disabled for workflow scan")
          PY

      - name: Run bounded v0.4 scan and write report
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          mkdir -p reports
          python - <<'PY'
          import json
          import os

          from masterkey_agent.core.engine import ScanEngine, build_default_registry
          from masterkey_agent.core.target import TargetPolicy
          from masterkey_agent.report import write_scan_report

          target_url = os.environ["TARGET_URL"]
          policy = TargetPolicy(
              timeout_seconds=10.0,
              max_response_bytes=256 * 1024,
              max_redirects=0,
              allow_http=True,
              allow_https=True,
          )

          session = ScanEngine(
              build_default_registry(),
              policy=policy,
          ).scan(target_url)

          report_path = "reports/master-security-agent-scan.json"
          write_scan_report(report_path, session)

          summary = {
              "session_id": session.session_id,
              "target": session.target["url"],
              "modules": len(session.modules),
              "evidence": len(session.evidence),
              "findings": len(session.findings),
              "errors": len(session.errors),
              "report": report_path,
          }
          print(json.dumps(summary, indent=2, sort_keys=True))

          if session.errors:
              raise SystemExit("Scan completed with errors; see the uploaded JSON report")
          PY

      - name: Upload scan report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: master-security-agent-scan-${{ github.run_id }}
          path: reports/master-security-agent-scan.json
          if-no-files-found: error
          retention-days: 7
